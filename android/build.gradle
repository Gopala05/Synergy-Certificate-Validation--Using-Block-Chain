buildscript {
    ext {
        compileSdkVersion = 34 // or whatever version you're using
        minSdkVersion = 30
        targetSdkVersion = 34
        androidxAppCompatVersion = '1.6.1' // example version
        androidxCoordinatorLayoutVersion = '1.2.0' // example version
        coreSplashScreenVersion = '1.0.0' // example version
        junitVersion = '4.13.2' // example version
        androidxJunitVersion = '1.1.5' // example version
        androidxEspressoCoreVersion = '3.5.1' // example version
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.2' // or your version
        classpath 'com.google.gms:google-services:4.3.15' // if using Firebase
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
